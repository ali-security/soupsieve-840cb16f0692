name: build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional pytest selector; empty runs the full suite'
        required: false
        default: ''

jobs:
  tests:
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        platform: [ubuntu-latest, windows-latest]
        hatch-env: [py311, py312, py313, py314, py315, stdlib]
        include:
          - hatch-env: py311
            python-version: '3.11'
            dev: dev
            continue-on-error: false
          - hatch-env: py312
            python-version: '3.12'
            dev: dev
            continue-on-error: false
          - hatch-env: py313
            python-version: '3.13'
            dev: dev
            continue-on-error: false
          - hatch-env: py314
            python-version: '3.14'
            dev: dev
            continue-on-error: false
          - hatch-env: py315
            python-version: '3.15'
            dev: dev
            continue-on-error: false
          - hatch-env: stdlib
            python-version: '3.14'
            dev: dev-stdlib
            continue-on-error: false
        # exclude:
        #   - platform: windows-latest
        #     hatch-env: py314

    env:
      TOXENV: ${{ matrix.hatch-env }}
      PYTEST_ADDOPTS: -rs

    runs-on: ${{ matrix.platform }}

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools hatch
    - name: Tests
      shell: bash
      run: |
        if [ -n "${{ inputs.test-filter }}" ]; then
          hatch run +py=${{ matrix.python-version }} ${{ matrix.dev }}:python -m pytest ${{ inputs.test-filter }}
        else
          hatch run +py=${{ matrix.python-version }} ${{ matrix.dev }}:tests
        fi

  lint:
    if: false
    timeout-minutes: 20
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.14]

    env:
      TOXENV: lint

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools hatch
    - name: Lint
      run: |
        python -m hatch run +py=${{ matrix.python-version }} dev:lint

  documents:
    if: false
    timeout-minutes: 20
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.14]

    env:
      TOXENV: documents

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools hatch
    - name: Install Aspell
      run: |
        sudo apt-get install aspell aspell-en
    - name: Build documents
      run: |
        python -m hatch run docs:spellcheck
